<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhoiner Cisneros | Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        hacksawGreen: '#8b5cf6',
                        hacksawDark: '#120d1b',
                        hacksawCard: '#141414',
                        hacksawCardHover: '#1f1f1f',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f5f5;
            color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes subtleWave {
            0%, 100% {
                transform: translateY(0px);
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            50% {
                transform: translateY(-2px);
                text-shadow: 0 6px 12px rgba(139, 92, 246, 0.16);
            }
        }

        .site-title {
            display: inline-block;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .site-title .letter {
            display: inline-block;
            animation: subtleWave 4.5s ease-in-out infinite;
            will-change: transform, text-shadow;
            transform-origin: center bottom;
        }

        .page-accent-band {
            position: fixed;
            left: 0;
            right: 0;
            top: 54%;
            transform: translateY(-50%);
            height: 300px;
            background: linear-gradient(90deg, rgba(139,92,246,0.96), rgba(168,85,247,0.9), rgba(139,92,246,0.96));
            border-radius: 0;
            box-shadow: 0 30px 70px rgba(139, 92, 246, 0.22);
            z-index: 0;
            pointer-events: none;
        }

        .steam-capsule-card .steam-capsule-image {
            opacity: 1;
        }

        .steam-capsule-card .card-background-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.62) 34%, rgba(0, 0, 0, 0.18) 68%, transparent 100%);
            opacity: 1;
        }

        .asset-design-portfolio-card .card-background-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.62) 34%, rgba(0, 0, 0, 0.18) 68%, transparent 100%);
            opacity: 1;
        }

        .asset-design-portfolio-card .asset-design-cover-image {
            opacity: 1;
        }

        .discord-username {
            display: inline-block;
            color: #8b5cf6;
            transition: color 180ms ease, text-shadow 180ms ease, transform 180ms ease;
        }

        .discord-contact:hover .discord-username {
            color: #c4b5fd;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.75);
            transform: scale(1.04);
        }

        .gallery-image-frame {
            background: linear-gradient(145deg, rgba(139, 92, 246, 0.75), rgba(38, 38, 38, 0.9) 35%, rgba(139, 92, 246, 0.45));
            padding: 2px;
        }

        .project-subcategory-card {
            position: relative;
            display: flex;
            min-height: 20rem;
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.42);
            border-radius: 1.5rem;
            background: linear-gradient(145deg, #292044, #111 68%);
            color: #fff;
            text-decoration: none;
            transition: border-color 180ms ease, transform 180ms ease;
        }

        .project-subcategory-card:hover,
        .project-subcategory-card:focus-visible {
            transform: translateY(-4px);
            border-color: #a78bfa;
        }

        .project-subcategory-card img {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-subcategory-card::before {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.96), rgba(0, 0, 0, 0.58) 48%, rgba(0, 0, 0, 0.08));
            content: "";
        }

        .project-subcategory-card.starfleet-emergence-card::before,
        .project-subcategory-card.asset-design-card::before,
        .project-subcategory-card.yerr-out-card::before {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.62) 34%, rgba(0, 0, 0, 0.18) 68%, transparent 100%);
        }

        .project-subcategory-card-content {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
        }

        .project-subcategory-card:not(a) {
            cursor: default;
        }

        .subcategory-title-mobile {
            display: none;
        }

        .gallery-image-button {
            display: block;
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #0a0a0a;
            cursor: zoom-in;
        }

        .gallery-image-button img {
            display: block;
            width: 100%;
            height: auto;
        }

        .gallery-image-button span {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 0.75rem;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .gallery-image-button:hover span,
        .gallery-image-button:focus-visible span {
            opacity: 1;
        }

        .steam-store-preview {
            overflow: hidden;
            border: 1px solid #253747;
            border-radius: 0.75rem;
            background: #101923;
            color: #d6e0e8;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
        }

        .steam-store-link {
            display: flex;
            width: 100%;
            min-height: 3.75rem;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
            border: 1px solid #5b4089;
            border-radius: 0.75rem;
            background: linear-gradient(to left, #49316f 0%, #2b2043 52%, #101923 100%);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition: filter 180ms ease, transform 180ms ease;
        }

        .steam-store-link:hover,
        .steam-store-link:focus-visible {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .steam-store-link i {
            font-size: 1.5rem;
        }

        .steam-preview-content {
            position: relative;
            isolation: isolate;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .steam-preview-content::before {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(16, 25, 35, 0.92), rgba(16, 25, 35, 0.92)),
                var(--steam-preview-background-image);
            background-position: center, center 35%;
            background-size: cover;
            content: "";
        }

        .steam-preview-breadcrumb {
            margin-bottom: 0.35rem;
            color: #8da3b5;
            font-size: 0.68rem;
        }

        .steam-preview-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(13rem, 0.8fr);
            align-items: start;
            gap: clamp(1rem, 2.5vw, 2rem);
        }

        .steam-preview-sample {
            order: 1;
            min-width: 0;
        }

        .steam-preview-media-column {
            order: 0;
            min-width: 0;
        }

        .steam-preview-game-title {
            margin: 0 0 0.8rem;
            color: #f2f6fa;
            font-size: clamp(1.05rem, 1.8vw, 1.35rem);
            font-weight: 700;
            line-height: 1.2;
        }

        .steam-preview-mobile-title {
            display: none;
        }

        .steam-preview-media-space {
            min-height: 16rem;
            aspect-ratio: 1.55 / 1;
            background: #000;
        }

        .steam-preview-sample img {
            display: block;
            width: 100%;
            aspect-ratio: 2.14 / 1;
            object-fit: cover;
            background: #0a1119;
        }

        .steam-preview-sample p {
            margin-top: 0.55rem;
            color: #c6d4df;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .steam-preview-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.9rem;
            color: #a7f3d0;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .steam-preview-rating-stars {
            color: #66c0f4;
            letter-spacing: 0.08em;
        }

        .steam-preview-details {
            display: grid;
            gap: 0.5rem;
            margin-top: 0.85rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(151, 190, 213, 0.16);
            font-size: 0.68rem;
        }

        .steam-preview-detail {
            display: grid;
            grid-template-columns: 5.2rem minmax(0, 1fr);
            gap: 0.5rem;
        }

        .steam-preview-detail dt {
            color: #8199aa;
            text-transform: uppercase;
        }

        .steam-preview-detail dd {
            margin: 0;
            color: #66c0f4;
        }

        .steam-preview-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.85rem;
        }

        .steam-preview-tags span {
            border-radius: 0.2rem;
            background: #20394c;
            padding: 0.25rem 0.45rem;
            color: #b8d8ea;
            font-size: 0.62rem;
        }

        .image-lightbox {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 4rem 1rem 1rem;
            border: 0;
            background: rgba(5, 5, 5, 0.97);
            color: #fff;
        }

        .image-lightbox::backdrop {
            background: rgba(0, 0, 0, 0.94);
        }

        .image-lightbox img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .image-lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: grid;
            width: 2.75rem;
            height: 2.75rem;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            background: rgba(38, 38, 38, 0.8);
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .image-lightbox-close:hover {
            background: #8b5cf6;
            color: #000;
        }

        @media (max-width: 767.98px) {
            body {
                background-color: #ffffff;
            }

            .gallery-page-title,
            .steam-preview-section-header {
                text-align: center;
            }

            .steam-preview-content,
            .steam-preview-content .steam-preview-sample,
            .steam-preview-content .steam-preview-media-column {
                text-align: center;
            }

            .steam-preview-rating,
            .steam-preview-tags {
                justify-content: center;
            }

            .steam-preview-detail {
                display: block;
                text-align: center;
            }

            .subcategory-page-header {
                text-align: center;
            }

            .subcategory-title-desktop {
                display: none;
            }

            .subcategory-title-mobile {
                display: block;
            }

            .subcategory-page-description {
                margin-left: auto;
                margin-right: auto;
                text-align: center;
            }

            .about-page-header,
            .about-bio {
                text-align: center;
            }

            .about-bio-actions {
                justify-content: center;
            }

            .steam-store-link {
                min-height: 3.5rem;
                padding: 0.75rem 1rem;
                font-size: 0.75rem;
                letter-spacing: 0.1em;
            }

            .steam-preview-layout {
                grid-template-columns: 1fr;
            }

            .steam-preview-sample {
                order: 0;
            }

            .steam-preview-media-column {
                order: 1;
            }

            .steam-preview-mobile-title {
                display: block;
                margin: 0.9rem 0 0;
            }

            .steam-preview-media-column .steam-preview-game-title {
                display: none;
            }

            .steam-preview-media-space {
                min-height: 0;
                aspect-ratio: 1.5 / 1;
            }

            .site-title {
                gap: 0;
            }

            .home-hero {
                text-align: center;
            }

            .home-hero h1 {
                margin-left: auto;
                margin-right: auto;
            }

            .home-hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .page-accent-band {
                top: 62%;
                height: 190px;
            }

            .mobile-card {
                background-color: #141414;
            }

            .mobile-card .placeholder-card-image,
            .mobile-card .card-background-overlay {
                display: none;
            }

            .mobile-card.steam-capsule-card .steam-capsule-image {
                display: block;
                opacity: 1;
            }

            .mobile-card.steam-capsule-card .card-background-overlay {
                display: block;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.62) 34%, rgba(0, 0, 0, 0.18) 68%, transparent 100%);
            }

            .mobile-card.asset-design-portfolio-card .asset-design-cover-image {
                display: block;
                opacity: 1;
            }

            .mobile-card.asset-design-portfolio-card .card-background-overlay {
                display: block;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.62) 34%, rgba(0, 0, 0, 0.18) 68%, transparent 100%);
                opacity: 1;
            }

            .mobile-card h3,
            .mobile-card p {
                color: #ffffff;
            }

            .mobile-card .explore-button {
                background-color: #ffffff;
                color: #000000;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto !important;
            }

            .site-title .letter {
                animation: none;
                will-change: auto;
            }
        }

        #app,
        footer,
        header {
            position: relative;
            z-index: 1;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b5cf6;
        }
    </style>
</head>

    <script>
        // Project Data for Categories
        const projectData = {
            'ui-ux': {
                title: 'UI/UX DESIGN',
                subtitle: 'Immersive HUDs, slot interfaces, and streamlined player experiences built for high engagement.',
                projects: [
                    { title: 'Cyberpunk Slot HUD', desc: 'Complete UI overhaul featuring dynamic multipliers, bet controls, and neon animations.', image: 'https://placehold.co/800x600/141414/8b5cf6?text=Cyberpunk+Slot+HUD' },
                    { title: 'Fantasy RPG Inventory & Menu', desc: 'Clean, medieval-fantasy inspired menu system with drag-and-drop feedback and tooltip styling.', image: 'https://placehold.co/800x600/141414/8b5cf6?text=RPG+Inventory+UI' },
                    { title: 'Arcade Spin Wheel Interface', desc: 'High-contrast mobile-first bonus wheel interface designed for instant gratification and clarity.', image: 'https://placehold.co/800x600/141414/8b5cf6?text=Arcade+Spin+Interface' }

            },

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu-overlay');
            const hamburger = document.getElementById('hamburger-icon');
            const spans = hamburger.getElementsByTagName('span');
            
            overlay.classList.toggle('opacity-0');
            overlay.classList.toggle('pointer-events-none');
            
            if (!overlay.classList.contains('pointer-events-none')) {
                // Transform to X
                spans[0].style.transform = 'rotate(45deg) translate(6px, 6px)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
                document.body.style.overflow = 'hidden';
            } else {
                // Revert to hamburger
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // Router / Navigation Controller
        function navigateTo(route) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            const app = document.getElementById('app');
            
            if (route === 'home') {
                app.innerHTML = renderHome();
            } else if (route === 'about') {
                app.innerHTML = renderAbout();
            } else if (route === 'portfolio') {
                app.innerHTML = renderPortfolio();
            } else if (route === 'contact') {
                app.innerHTML = renderContact();
            } else if (route.startsWith('category-')) {
                const routeKey = route.replace('category-', '');
                const categoryAliases = { ui: 'ui-ux', keyart: 'key-art' };
                const catKey = categoryAliases[routeKey] || routeKey;
                app.innerHTML = renderCategory(catKey);
            } else {
                app.innerHTML = renderHome();
            }
        }

        function applyLetterWave(selector) {
            const title = document.querySelector(selector);
            if (!title) return;

            const letters = title.querySelectorAll('.letter');
            letters.forEach((letter, index) => {
                letter.style.animationDelay = `${index * 0.08}s`;
                letter.style.animationDuration = `${4.5 + (index % 4) * 0.25}s`;
            });
        }

                        <a href="https://www.fiverr.com/s/K3wXw6l" target="_blank" rel="noopener noreferrer" class="group bg-hacksawCard border border-neutral-800 p-8 rounded-3xl flex flex-col items-center justify-center hover:border-hacksawGreen transition-all duration-300 shadow-2xl">
                            <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-neutral-700 flex items-center justify-center text-2xl text-white mb-4 group-hover:scale-110 group-hover:bg-hacksawGreen group-hover:text-black transition-all">
                                <svg aria-hidden="true" viewBox="0 0 24 24" class="h-7 w-7 fill-current"><path d="M23.004 15.588a.995.995 0 1 0 .002-1.99.995.995 0 0 0-.002 1.99zm-.996-3.705h-.85c-.546 0-.84.41-.84 1.092v2.466h-1.61v-3.558h-.684c-.547 0-.84.41-.84 1.092v2.466h-1.61v-4.874h1.61v.74c.264-.574.626-.74 1.163-.74h1.972v.74c.264-.574.625-.74 1.162-.74h.527v1.316zm-6.786 1.501h-3.359c.088.546.43.858 1.006.858.43 0 .732-.175.83-.487l1.425.4c-.351.848-1.22 1.364-2.255 1.364-1.748 0-2.549-1.355-2.549-2.515 0-1.14.703-2.505 2.45-2.505 1.856 0 2.471 1.384 2.471 2.408 0 .224-.01.37-.02.477zm-1.562-.945c-.04-.42-.342-.81-.889-.81-.508 0-.81.225-.908.81h1.797zM7.508 15.44h1.416l1.767-4.874h-1.62l-.86 2.837-.878-2.837H5.72l1.787 4.874zm-6.6 0H2.51v-3.558h1.524v3.558h1.591v-4.874H2.51v-.302c0-.332.235-.536.606-.536h.918V8.412H2.85c-1.162 0-1.943.712-1.943 1.755v.4H0v1.316h.908v3.558z"/></svg>
                            </div>
                            <h3 class="text-lg font-black uppercase text-white mb-1">FIVERR</h3>
                            <span class="text-sm text-neutral-400 group-hover:text-hacksawGreen transition-colors">fiverr.com</span>
                        </a>

                        <!-- Instagram -->
                        <a href="https://www.instagram.com/jhoinercisneros" target="_blank" rel="noopener noreferrer" class="group bg-hacksawCard border border-neutral-800 p-8 rounded-3xl flex flex-col items-center justify-center hover:border-hacksawGreen transition-all duration-300 shadow-2xl">
                            <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-neutral-700 flex items-center justify-center text-2xl text-white mb-4 group-hover:scale-110 group-hover:bg-hacksawGreen group-hover:text-black transition-all">
                                <i class="fa-brands fa-instagram"></i>
                            </div>
                            <h3 class="text-lg font-black uppercase text-white mb-1">INSTAGRAM</h3>
                            <span class="text-sm text-neutral-400 group-hover:text-hacksawGreen transition-colors">@jhoinercisneros</span>
                        </a>

                        <!-- Discord -->
                        <div class="discord-contact group bg-hacksawCard border border-neutral-800 p-8 rounded-3xl flex flex-col items-center justify-center hover:border-hacksawGreen transition-all duration-300 shadow-2xl sm:col-span-2 sm:w-1/2 sm:justify-self-center">
                            <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-neutral-700 flex items-center justify-center text-2xl text-white mb-4 group-hover:scale-110 group-hover:bg-hacksawGreen group-hover:text-black transition-all">
                                <i class="fa-brands fa-discord"></i>
                            </div>
                            <h3 class="text-lg font-black uppercase text-white mb-1">DISCORD</h3>
                            <span class="text-sm text-neutral-400">User: <span class="discord-username">jhoinercisneros</span></span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CATEGORY DETAIL VIEW (3 Projects per category)
        function renderCategory(catKey) {
            const data = projectData[catKey];
            if (!data) return renderHome();

            if (data.galleryImages) {
                return renderImageGallery(data);
            }

            if (data.subcategories) {
                return renderSubcategories(data);
            }

            let projectsHtml = '';
            data.projects.forEach((proj, idx) => {
                projectsHtml += `
                    <div class="bg-hacksawCard border border-neutral-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between">
                        <div class="relative overflow-hidden aspect-video">
                            <img src="${proj.image}" alt="${proj.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-4 left-4 bg-black/70 backdrop-blur-md px-3 py-1 rounded-full border border-neutral-700 text-xs font-bold text-white">
                                PROJECT 0${idx + 1}
                            </div>
                        </div>
                        <div class="p-8 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="text-2xl font-black uppercase text-white mb-3">${proj.title}</h3>
                                <p class="text-neutral-400 text-sm leading-relaxed mb-6">${proj.desc}</p>
                            </div>
                            <div class="pt-4 border-t border-neutral-900 flex items-center justify-between">
                                <span class="text-xs font-bold text-neutral-500 uppercase tracking-widest">Jhoiner Cisneros Art</span>
                                <span class="text-xs font-extrabold text-hacksawGreen uppercase tracking-widest">
                                    PROJECT PREVIEW
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="max-w-7xl mx-auto px-6 lg:px-16 pt-12 pb-24">
                    <!-- Back Button & Header -->
                    <div class="mb-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <a href="#portfolio" class="inline-flex items-center gap-2 text-xs font-extrabold uppercase tracking-widest bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-xl hover:bg-neutral-800 text-neutral-300 hover:text-white transition-colors w-fit no-underline">
                            <i class="fa-solid fa-arrow-left"></i> BACK TO PORTFOLIO
                        </a>
                        <span class="text-xs font-bold px-3 py-1 bg-neutral-900 border border-neutral-800 rounded-full text-hacksawGreen uppercase tracking-widest w-fit">
                            FEATURED COLLECTION
                        </span>
                    </div>

                    <div class="mb-16">
                        <h1 class="text-4xl sm:text-6xl font-black uppercase tracking-tight text-black mb-4">${data.title}</h1>
                        <p class="text-black text-base sm:text-lg max-w-2xl">${data.subtitle}</p>
                    </div>

                    <!-- 3 Distinct Project Items/Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${projectsHtml}
                    </div>
                </div>
            `;
        }

        function renderSubcategories(data) {
            const subcategoriesHtml = data.subcategories.map(item => {
                const content = `
                    ${item.image ? `<img src="${item.image}" alt="" aria-hidden="true">` : ''}
                    <div class="project-subcategory-card-content">
                        <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-tight mb-3">${item.title}</h2>
                        ${item.description ? `<p class="text-sm text-neutral-300 mb-6">${item.description}</p>` : ''}
                        <span class="text-xs font-extrabold uppercase tracking-widest text-violet-300">
                            ${item.comingSoon ? 'COMING SOON' : 'EXPLORE PROJECT'}
                        </span>
                    </div>
                `;

                return item.comingSoon
                    ? `<div class="project-subcategory-card" aria-label="${item.title}, coming soon">${content}</div>`
                    : `<a class="project-subcategory-card${item.route === 'category-starfleet-emergence' ? ' starfleet-emergence-card' : ''}${item.route === 'category-yerr-out' ? ' yerr-out-card' : ''}${item.route === 'category-stylized-dark-design' ? ' asset-design-card' : ''}" href="#${item.route}" onclick="navigateTo('${item.route}')">${content}</a>`;
            }).join('');

            return `
                <div class="max-w-7xl mx-auto px-6 lg:px-16 pt-8 sm:pt-12 pb-24">
                    <a href="#portfolio" onclick="navigateTo('portfolio')" class="inline-flex items-center gap-2 text-xs font-extrabold uppercase tracking-widest bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-xl hover:bg-neutral-800 text-neutral-300 hover:text-white transition-colors mb-8 no-underline">
                        <i class="fa-solid fa-arrow-left"></i> BACK TO PORTFOLIO
                    </a>
                    <header class="mb-10 sm:mb-14">
                        <h1 class="subcategory-page-header text-4xl sm:text-6xl font-black uppercase tracking-tight text-black mb-4" aria-label="${data.title}">
                            <span class="subcategory-title-desktop" aria-hidden="true">${data.title}</span>
                            <span class="subcategory-title-mobile" aria-hidden="true">${data.mobileTitle}</span>
                        </h1>
                        <p class="subcategory-page-description text-black text-base sm:text-lg max-w-2xl">${data.subtitle}</p>
                    </header>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                        ${subcategoriesHtml}
                    </div>
                </div>
            `;
        }

        function renderImageGallery(data) {
            const imagesHtml = data.galleryImages.map((item, index) => `
                <div class="gallery-image-frame rounded-2xl sm:rounded-3xl shadow-2xl">
                    <button class="gallery-image-button rounded-[14px] sm:rounded-[22px]" type="button"
                        data-image="${item.image}" data-alt="${item.alt}" aria-label="View ${item.alt} fullscreen">
                        <img src="${item.image}" alt="${item.alt}" loading="${index === 0 ? 'eager' : 'lazy'}">
                        <span>View fullscreen</span>
                    </button>
                </div>
            `).join('');
            const storePreview = data.storePreview ? `
                <section class="steam-preview-section pt-4 sm:pt-8" aria-labelledby="steam-preview-heading">
                    <div class="steam-preview-section-header mb-5 sm:mb-7">
                        <p class="text-xs font-extrabold uppercase tracking-[0.2em] text-violet-600 mb-2">Artwork presentation</p>
                        <h2 id="steam-preview-heading" class="text-2xl sm:text-4xl font-black uppercase tracking-tight text-black">STEAM STORE PAGE PREVIEW</h2>
                    </div>
                    <div class="steam-store-preview">
                        <div class="steam-preview-content" style="--steam-preview-background-image: url('${data.storePreview.backgroundImage}')">
                            <p class="steam-preview-breadcrumb">All Games &gt; Featured &gt; ${data.title}</p>
                            <div class="steam-preview-layout">
                                <div class="steam-preview-media-column">
                                    <h3 class="steam-preview-game-title">${data.title}</h3>
                                    <div class="steam-preview-media-space" aria-label="Black media area placeholder"></div>
                                </div>
                                <aside class="steam-preview-sample">
                                    <img src="${data.storePreview.image}" alt="${data.title} sample store artwork" loading="lazy">
                                    <h3 class="steam-preview-mobile-title steam-preview-game-title">${data.title}</h3>
                                    <p>${data.storePreview.description}</p>
                                    <div class="steam-preview-rating">
                                        <span class="steam-preview-rating-stars" aria-label="5 out of 5 stars">★★★★★</span>
                                        <span>${data.storePreview.reviews}</span>
                                    </div>
                                    <dl class="steam-preview-details">
                                        <div class="steam-preview-detail">
                                            <dt>Release date</dt><dd>${data.storePreview.releaseDate}</dd>
                                        </div>
                                        <div class="steam-preview-detail">
                                            <dt>Developer</dt><dd>${data.storePreview.developer}</dd>
                                        </div>
                                        <div class="steam-preview-detail">
                                            <dt>Publisher</dt><dd>${data.storePreview.publisher}</dd>
                                        </div>
                                        <div class="steam-preview-detail">
                                            <dt>Editor</dt><dd>${data.storePreview.editor}</dd>
                                        </div>
                                    </dl>
                                    <div class="steam-preview-tags" aria-label="Example categories">
                                        ${data.storePreview.tags.map(tag => `<span>${tag}</span>`).join('')}
                                    </div>
                                </aside>
                            </div>
                        </div>
                    </div>
                    ${data.storePreview.steamUrl ? `
                        <a class="steam-store-link" href="${data.storePreview.steamUrl}" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-steam" aria-hidden="true"></i>
                            <span>View on Steam</span>
                        </a>
                    ` : ''}
                </section>
            ` : '';

            return `
                <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10 pt-8 sm:pt-12 pb-24">
                    <a href="#${data.backRoute || 'category-keyart'}" onclick="navigateTo('${data.backRoute || 'category-keyart'}')" class="inline-flex items-center gap-2 text-xs font-extrabold uppercase tracking-widest bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-xl hover:bg-neutral-800 text-neutral-300 hover:text-white transition-colors mb-8 no-underline">
                        <i class="fa-solid fa-arrow-left"></i> ${data.backLabel || 'BACK TO COLLECTIONS'}
                    </a>
                    <header class="mb-8 sm:mb-10">
                        <h1 class="gallery-page-title text-3xl sm:text-5xl font-black uppercase tracking-tight text-black">${data.title}</h1>
                    </header>
                    <div class="flex flex-col gap-8 sm:gap-12">
                        ${imagesHtml}
                    </div>
                    ${storePreview}
                </div>
            `;
        }

        function openGalleryImage(button) {
            const lightbox = document.getElementById('image-lightbox');
            const image = document.getElementById('image-lightbox-image');
            image.src = button.dataset.image;
            image.alt = button.dataset.alt;
            lightbox.showModal();
        }

        function closeGalleryImage() {
            document.getElementById('image-lightbox').close();
        }

        // Initialize Router on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            applyLetterWave('.site-title');
            document.getElementById('app').addEventListener('click', event => {
                const button = event.target.closest('.gallery-image-button');
                if (button) openGalleryImage(button);
            });
            const lightbox = document.getElementById('image-lightbox');
            lightbox.addEventListener('click', event => {
                if (event.target === event.currentTarget) closeGalleryImage();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && lightbox.open) {
                    event.preventDefault();
                    closeGalleryImage();
                }
            });
            const hash = window.location.hash.replace('#', '') || 'home';
            navigateTo(hash);
        });

        // Handle browser back/forward navigation
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '') || 'home';
            navigateTo(hash);
            applyLetterWave('.site-title');
        });
    </script>
</body>
</html>
