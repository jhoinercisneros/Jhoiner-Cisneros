            overflow-x: hidden;
            position: relative;
        }

        @keyframes subtleWave {
            0%, 100% {
                transform: translateY(0px);
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            50% {
                transform: translateY(-2px);
                text-shadow: 0 6px 12px rgba(139, 92, 246, 0.16);

        .site-title {
            display: inline-block;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .site-title .letter {

            animation: subtleWave 4.5s ease-in-out infinite;
            will-change: transform, text-shadow;
            transform-origin: center bottom;
        }

        .page-accent-band {
            position: fixed;
            left: 0;
            right: 0;
            top: 54%;
            transform: translateY(-50%);
            height: 300px;
            background: linear-gradient(90deg, rgba(139,92,246,0.96), rgba(168,85,247,0.9), rgba(139,92,246,0.96));

            z-index: 0;
            pointer-events: none;
        }

            body {
                background-color: #ffffff;
            }

            .home-hero {
                text-align: center;
            }

            .home-hero h1 {

                margin-right: auto;
            }

            .home-hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .page-accent-band {

            .mobile-card {

            .mobile-card .placeholder-card-image,

                display: none;
            }

            .mobile-card h3,

                color: #ffffff;

            .mobile-card .explore-button {

        #app,

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu-overlay');
            const hamburger = document.getElementById('hamburger-icon');
            const spans = hamburger.getElementsByTagName('span');
            
            overlay.classList.toggle('opacity-0');
            overlay.classList.toggle('pointer-events-none');
            
            if (!overlay.classList.contains('pointer-events-none')) {
                // Transform to X
                spans[0].style.transform = 'rotate(45deg) translate(6px, 6px)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
                document.body.style.overflow = 'hidden';
            } else {
                // Revert to hamburger
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // Router / Navigation Controller
        function navigateTo(route) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            const app = document.getElementById('app');
            
            if (route === 'home') {
                app.innerHTML = renderHome();
            } else if (route === 'about') {
                app.innerHTML = renderAbout();
            } else if (route === 'portfolio') {
                app.innerHTML = renderPortfolio();
            } else if (route === 'contact') {
                app.innerHTML = renderContact();
            } else if (route.startsWith('category-')) {
                const catKey = route.replace('category-', '');
                app.innerHTML = renderCategory(catKey);
            } else {
                app.innerHTML = renderHome();
            }
        }

        function applyLetterWave(selector) {
            const title = document.querySelector(selector);
            if (!title) return;

            const letters = title.querySelectorAll('.letter');
            letters.forEach((letter, index) => {
                letter.style.animationDelay = `${index * 0.08}s`;
                letter.style.animationDuration = `${4.5 + (index % 4) * 0.25}s`;
            });
        }
